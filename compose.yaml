services:
  postgres:
    image: postgres:17
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  garage:
    image: dxflrs/garage:v2.1.0
    env_file: .env
    ports:
      - "3900:3900"   # API S3, utilisée par l'appli
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

volumes:
  pgdata:
  garage-meta:
  garage-data:

